name: CI/CD Pipeline

on:
  push:
    branches: [ main, docker, flutter ]
  pull_request:
    branches: [ main, docker, flutter ]

jobs:
  test-backend:
    name: Test .NET Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Portal.sln

      - name: Build Solution
        run: dotnet build Portal.sln --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test Portal.sln --no-build --configuration Release --verbosity normal

  test-mobile:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal_mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: flutter test

  build-mobile-release:
    name: Build Android Release APK
    needs: [test-backend, test-mobile]
    if: (github.ref == 'refs/heads/flutter' || github.ref == 'refs/heads/docker') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build APK
        working-directory: portal_mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-app-release
          path: portal_mobile/build/app/outputs/flutter-apk/app-release.apk
