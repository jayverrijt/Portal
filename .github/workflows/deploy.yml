name: CI/CD Pipeline - Portal

on:
  push:
    branches:
      - docker

jobs:
  # ==========================================
  # 1. CI (Continuous Integration): Validatie
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Portal.sln

      - name: Build solution (check op compileerfouten)
        run: dotnet build Portal.sln --no-restore --configuration Release

  # ==========================================
  # 2. CD (Continuous Deployment): Uitlevering
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test  # Draait pas als de build 100% slaagt

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            echo "Navigating to project directory..."
            cd ${{ secrets.PROJECT_DIR }}

            echo "Pulling latest changes..."
            git fetch origin docker
            git reset --hard origin/docker

            echo "Rebuilding and restarting containers..."
            docker compose up -d --build

            echo "Cleaning up unused build cache..."
            docker image prune -f

            echo "Deployment completed successfully!"
