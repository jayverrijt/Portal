name: Build Flutter Mobile App

on:
  push:
    branches:
      - flutter
  pull_request:
    branches:
      - flutter

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v3
        with:
          flutter-version: '3.x' # Of je specifieke Flutter versie
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: . # Pas dit aan als je app in een submap staat, bijv. portal_mobile

      - name: Build APK (Release)
        run: flutter build apk --release
        working-directory: .

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
